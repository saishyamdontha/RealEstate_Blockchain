spring.application.name=RealEstate2

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/re2_app}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# SQL echo floods logs and buries real errors; enable with SHOW_SQL=true when debugging
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Disable Spring Session JDBC (optional)
spring.session.store-type=none

blockchain.privateKey=${BLOCKCHAIN_PRIVATE_KEY:}
blockchain.rpc=${BLOCKCHAIN_RPC:http://127.0.0.1:8545}
blockchain.contract=${BLOCKCHAIN_CONTRACT:}


# Every log line carries the request ID set by RequestLoggingFilter (empty outside requests)
logging.pattern.level=%5p [rid=%X{rid:-}]
