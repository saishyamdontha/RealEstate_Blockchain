name: Security

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download dependencies into the local Maven cache
        run: mvn -B -q dependency:resolve

      - name: Scan dependencies
        run: >
          docker run --rm
          -v "$PWD:/src"
          -v "$HOME/.m2:/root/.m2"
          ghcr.io/aquasecurity/trivy:latest
          fs --scanners vuln --offline-scan
          --severity HIGH,CRITICAL --exit-code 0 /src

  static-analysis:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto src/main/java
