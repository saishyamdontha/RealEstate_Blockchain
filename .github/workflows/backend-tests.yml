name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        # RealEstate2ApplicationTests is a full Spring context-load smoke
        # test that requires a real Postgres connection; not run in CI
        # since there's no database service configured here. The real
        # logic tests (PropertyServiceImplTest) run normally.
        run: mvn -B test -Dtest='!RealEstate2ApplicationTests'
